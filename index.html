<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">


</head>

<body data-theme="light">
  <header>

    <nav class="navbar navbar-dark shadow-sm">
      <div class="container-fluid px-4">
        <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
          <i class="bi bi-wallet2"></i>
          Expense Tracker
        </span>
        <div class="d-flex align-items-center text-white ">
          <button id="themeToggle" class="btn btn-sm btn-outline-light me-3 " title="Toggle theme">
            <i class="bi bi-moon" id="themeIcon"></i>
          </button>
          <span class="d-none d-md-inline">Walaa Aimen</span>
        </div>
      </div>
    </nav>
  </header>


  <div class="container-fluid px-4 py-4">

    <!-- Summary Cards -->
    <div class="summary-grid mb-4">
      <div class="card summary-card summary-blue border-0 shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <p class="summary-label">Total Amount</p>
            <h2 class="summary-value" id="totalAmount">$0.00</h2>
          </div>
          <div class="summary-icon">
            <i class="bi bi-wallet2"></i>
          </div>
        </div>
      </div>

      <div class="card summary-card summary-purpul border-0 shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <p class="summary-label">Expenses Count</p>
            <h2 class="summary-value" id="totalCount">0</h2>
          </div>
          <div class="summary-icon">
            <i class="bi bi-receipt"></i>
          </div>
        </div>
      </div>

      <div class="card summary-card summary-pink border-0 shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <p class="summary-label">Highest Expense</p>
            <h2 class="summary-value" id="highestExpense">$0.00</h2>
          </div>
          <div class="summary-icon">
            <i class="bi bi-graph-up-arrow"></i>
          </div>
        </div>
      </div>
    </div>



    <div class="row g-4">

      <!--  Form -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-1">New Expense</h5>
            <p class="text-muted small mb-4">Add a new transaction below to update stats</p>

            <form id="expenseForm">
              <div class="mb-3">
                <label class="form-label fw-semibold  text-secondary">Title</label>
                <input type="text" class="form-control " id="title" required>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Amount</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input type="number" step="0.01" class="form-control" id="amount" placeholder="0.00" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Category</label>
                <select class="form-select" id="category" required>
                  <option value="">Select category</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">Date</label>
                <input type="date" class="form-control" id="date" required>
              </div>

              <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                <i class="bi bi-plus-lg me-1"></i> Add Expense
              </button>
            </form>
          </div>
        </div>
      </div>

      <!--  Table -->
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold mb-0">Recent Activities</h5>
              <select class="form-select form-select-sm w-auto" id="filterCategory">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Spinner -->
            <div id="spinner" class="text-center my-4 d-none">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>

            <!-- Alert -->
            <div id="alertBox"></div>

            <!-- Table -->
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr class="table-header-row">
                    <th>TITLE</th>
                    <th>AMOUNT</th>
                    <th>CATEGORY</th>
                    <th>DATE</th>
                    <th class="text-end">ACTIONS</th>
                  </tr>
                </thead>
                <tbody id="expensesTable">
                </tbody>
              </table>
            </div>

            <!-- Footer -->
            <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
              <small class="text-muted" id="tableInfo">Loading...</small>
              <div>
                <button class="btn btn-sm btn-outline-secondary me-2" disabled>Previous</button>
                <button class="btn btn-sm btn-outline-secondary" disabled>Next</button>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- Edit Modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-2 border-0">
        <div class="modal-header border-botoom-1 p-3">
          <h5 class="modal-title fw-bold text-dark">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <form id="editForm">
          <div class="modal-body p-4">
            <input type="hidden" id="editId">

            <div class="mb-3">
              <label class="form-label fw-semibold">Title</label>
              <input type="text" class="form-control" id="editTitle" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Amount</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" step="0.01" class="form-control" id="editAmount" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Category</label>
              <select class="form-select" id="editCategory" required>
                <option value="">Select category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Date</label>
              <input type="date" class="form-control" id="editDate" required>
            </div>
          </div>

          <div class="modal-footer p-3 background-color-light">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>

      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
